packages:
  - "packages/*"
  - "examples/*"
  - "scripts/guides-typecheck"
  - "scripts/parity"

# pnpm 11 replaced the package.json `pnpm.onlyBuiltDependencies` list with
# this `allowBuilds` map (onlyBuiltDependencies was removed). These native
# deps need their install/build scripts to run. https://pnpm.io/settings
allowBuilds:
  better-sqlite3: true
  esbuild: true
  libsql: true

# pnpm 12 replaced `managePackageManagerVersions` with this. `ignore` makes pnpm
# neither self-install the `packageManager` pin nor record it as
# a `packageManagerDependencies` document at the head of pnpm-lock.yaml — that
# document differed between a cold store and a warm one, so a frozen install
# rewrote it in place. Use `corepack enable` to honour the pin locally.
pmOnFail: ignore
