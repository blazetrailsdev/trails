# Daily request-path benchmark of examples/twelve-dollar-server (RFC 0241).
# Runs the slim harness's plain pass from bench/run.sh against main HEAD and
# appends one JSON record to perf/history.jsonl on the perf-data branch.
name: Perf

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      vus:
        description: k6 virtual users (keep the runner below saturation)
        default: "200"

concurrency:
  group: perf
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHALLENGE_DIR: ${{ github.workspace }}/challenge
      OUT: ${{ github.workspace }}/perf-out
      VUS: ${{ inputs.vus || '200' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          repository: arjaythedev/twelve-dollar-server-challenge
          path: challenge
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 jq
      - uses: grafana/setup-k6-action@v1
      - name: Build trails
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec tsc --build packages/trailties packages/rackup packages/activerecord packages/actionpack
      - id: challenge
        run: echo "sha=$(git -C challenge rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: seed
        with:
          path: |
            challenge/seed/feed.db
            challenge/seed/tokens.json
          key: tdsc-seed-${{ steps.challenge.outputs.sha }}
      - if: steps.seed.outputs.cache-hit != 'true'
        run: bash challenge/seed/make-seed.sh
      - name: Bench
        run: bash examples/twelve-dollar-server/bench/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ github.run_id }}
          path: perf-out
      - name: Append to perf-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin perf-data || true
          git worktree add --detach "$RUNNER_TEMP/perf-data"
          cd "$RUNNER_TEMP/perf-data"
          if git rev-parse --verify -q origin/perf-data >/dev/null; then
            git checkout -B perf-data origin/perf-data
          else
            git checkout --orphan perf-data
            git rm -rfq .
          fi
          mkdir -p perf
          cat "$OUT/record.json" >> perf/history.jsonl
          git add perf/history.jsonl
          git commit -m "perf: record run ${{ github.run_id }}"
          git push origin perf-data
