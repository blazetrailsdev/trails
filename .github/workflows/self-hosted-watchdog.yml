name: Self-hosted watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: self-hosted-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          RERUN_TOKEN: ${{ github.token }}
        run: scripts/ci/self-hosted-watchdog.sh --max-queued-minutes 15
