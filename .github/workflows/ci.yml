name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Labels opt in specific suites without needing a new commit:
    #   run-parity-sqlite   — schema + query parity (SQLite fixtures)
    #   run-parity-postgres — Postgres-specific parity (future)
    #   run-parity-mysql    — MySQL/MariaDB-specific parity (future)
    #   run-sqlite-mem      — the ARCONN=sqlite3_mem AR suite (otherwise only
    #                         main / the weekly sweep / workflow_dispatch).
    #                         Opting in also gates the merge on it: the job is
    #                         in the `ci` aggregator's `needs:`.
    #   run-mysql-prepared  — the MYSQL_PREPARED_STATEMENTS AR suite (otherwise
    #                         only the weekly sweep / workflow_dispatch — it
    #                         does not run on pushes to main).
    #                         Opting in also gates the merge on it: the job is
    #                         in the `ci` aggregator's `needs:`.
    #   run-guides          — the Guides Code Type Check (otherwise only
    #                         main / the weekly sweep / workflow_dispatch).
    #                         Opting in also gates the merge on it: the job is
    #                         in the `ci` aggregator's `needs:`.
    #   run-db-adapters     — force the PostgreSQL + MariaDB AR suites on a
    #                         draft PR that doesn't touch adapter paths; they
    #                         run unconditionally once it is ready for review.
    #   website             — force the Website build on a PR that doesn't
    #                         touch packages/website/
    #   release             — implies `website` (release PRs need the site
    #                         built); reserve other release-only suites here
    # `ready_for_review` is what starts the draft-deferred PG/MariaDB suites;
    # without it a PR can reach ready with no adapter coverage and no event
    # left to trigger it.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    # Weekly post-merge sweep so slow regressions can't hide between
    # parity-relevant PRs. Monday 06:00 UTC is off-peak on an Ubuntu runner.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on PR pushes; keep main/schedule runs intact so
# post-merge sweeps and timing reports aren't lost.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Preflight that sets `docs_only=true` when every changed path is under
  # top-level `docs/` or is the top-level `README.md`. Downstream jobs gate on this via `if:` so they're
  # reported as skipped on docs-only PRs. Skipped required checks in
  # branch protection DO block merges, so point branch protection at the
  # aggregate `CI` job at the bottom of this file instead of individual
  # jobs — `CI` always runs and treats skipped needs as success.
  # `packages/website/docs` does not qualify; it lives under
  # `packages/website/` and affects the site build.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      activerecord_affected: ${{ steps.filter.outputs.activerecord_affected }}
      db_adapter_affected: ${{ steps.filter.outputs.db_adapter_affected }}
      actionpack_affected: ${{ steps.filter.outputs.actionpack_affected }}
      actionview_affected: ${{ steps.filter.outputs.actionview_affected }}
      rack_affected: ${{ steps.filter.outputs.rack_affected }}
      trailties_affected: ${{ steps.filter.outputs.trailties_affected }}
      trails_tsc_affected: ${{ steps.filter.outputs.trails_tsc_affected }}
      tse_compiler_affected: ${{ steps.filter.outputs.tse_compiler_affected }}
      unit_tests_affected: ${{ steps.filter.outputs.unit_tests_affected }}
      guides_affected: ${{ steps.filter.outputs.guides_affected }}
      website_affected: ${{ steps.filter.outputs.website_affected }}
      comparison_affected: ${{ steps.filter.outputs.comparison_affected }}
      website_label: ${{ steps.filter.outputs.website_label }}
      parity_sqlite: ${{ steps.filter.outputs.parity_sqlite }}
      parity_postgres: ${{ steps.filter.outputs.parity_postgres }}
      parity_mysql: ${{ steps.filter.outputs.parity_mysql }}
      # Newline-separated list of changed files (existing ones only —
      # deletions excluded) for the Prettier job to check. The literal
      # `__ALL__` means "couldn't compute a reliable diff, check everything".
      prettier_files: ${{ steps.filter.outputs.prettier_files }}
      # Same shape as prettier_files, narrowed to the extensions ESLint is
      # configured for. `__ALL__` additionally covers every non-PR event (a
      # type-aware rule can break a file no PR touched) and the case where a
      # changed file feeds a rule's inputs rather than being linted itself —
      # see LINT_ALL_RE below.
      lint_files: ${{ steps.filter.outputs.lint_files }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          # Labels live on the PR even when the firing event is `labeled`,
          # `synchronize`, etc., so we can scan them uniformly.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # Gate rationale: scripts/ci-suite-coverage.test.ts ("Gate reference").
          INFRA_RE='^(pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|tsconfig[^/]*\.json$|vitest[^/]*\.config\.ts$|scripts/|\.github/workflows/ci\.yml$|\.github/actions/)'
          INFRA_CARVEOUT_RE='^scripts/((tasks|ci|guides-typecheck|rails-find|sync-stats|phase-g-hunt|fixtures-inventory|test-deps|__fixtures__|api-compare|test-compare|fixtures-compare|schema-compare|parity)/|(build-rails-privates-manifest|build-rails-file-structure-manifest|rails-file-structure-mixins|rails-file-structure-collisions|strip-asany|ci-suite-coverage|deprecated-manifest-diff|mixin-declaration-drift|mysql-grant-namespaces|stale-story-references|closing-story-references)(\.test)?\.ts$)'
          AR_PKGS_RE='^packages/(activerecord|activerecord-cli|arel|activemodel|activesupport|globalid|date|did-you-mean|trails-tsc)/'
          DB_ADAPTER_RE='^(packages/activerecord/src/(adapters/(postgresql|abstract-mysql-adapter)|connection-adapters/(postgresql|mysql|mysql2|abstract-mysql-adapter|abstract/|abstract-adapter\.ts|column\.ts|adapter-args\.ts|sql-classification\.ts|pool))|packages/arel/src/visitors/(postgres|mysql)|packages/activerecord-cli/src/__e2e__/(postgres|mysql))'
          AP_PKGS_RE='^packages/(actionpack|actionview|activemodel|activesupport|rack|date|did-you-mean)/'
          AV_PKGS_RE='^packages/(actionview|activesupport|date)/'
          TRAILTIES_PKGS_RE='^packages/(trailties|actionpack|actionview|activerecord|arel|activemodel|activesupport|globalid|rack|date|did-you-mean|trails-tsc)/'
          TRAILS_TSC_PKGS_RE='^packages/trails-tsc/'
          TSE_COMPILER_PKGS_RE='^packages/tse-compiler/'
          RACK_PKGS_RE='^packages/(rack|activesupport|date)/'
          # `packages/`, `scripts/` and `eslint/` are listed whole rather than
          # enumerated, because several tests in this lane report on the WHOLE
          # tree rather than on their own package: stale-story-references
          # scans exactly those three SOURCE_ROOTS
          # (scripts/stale-story-references.ts:31), as do
          # non-transactional-row-writes and mixin-declaration-drift. Listing
          # only the packages whose own tests live here let a citation under
          # packages/activerecord/ invalidate a guard result in a lane that
          # never ran — #6980 closed a story cited in
          # connection-adapters/column.ts, and the red surfaced a push later
          # on main against an unrelated diff (#6989).
          UNIT_TESTS_PKGS_RE='^(packages/|scripts/|eslint/|eslint\.config\.mjs$|vendor/(sources\.ts|sources\.lock\.json|sources\.test\.ts|fetch\.ts)$)'
          GUIDES_PKGS_RE='^(packages/(activerecord|activemodel|activesupport|arel|globalid|date|did-you-mean|trails-tsc)/|packages/website/docs/guides/|scripts/guides-typecheck/)'
          GUIDES_EXCL_RE='(/src/test-helpers(/|\.ts$)|/test-fixtures?(/|\.ts$)|/__fixtures__/|/__snapshots__/|\.test\.ts$)'
          WEBSITE_PKGS_RE='^packages/website/'
          # Files that make a scoped ESLint run unsound, so the whole tree is
          # linted instead. Three classes, all "the changed file is an INPUT to
          # a rule rather than a file the rule reports on":
          #   - eslint.config.mjs / eslint/ — every rule implementation, every
          #     per-rule exclude JSON, and every path-scoped override.
          #   - the eslint version pin: package.json declares it,
          #     pnpm-lock.yaml resolves it. Mirrors the Prettier fallback's
          #     reasoning about its own pin.
          #   - stubbed-ddl-methods.ts, whose STUBBED_DDL_METHODS array
          #     no-load-schema-with-stubbed-ddl parses out of the source
          #     (eslint/no-load-schema-with-stubbed-ddl.mjs:38).
          #   - vendor/, which expected-fixtures reads the Rails-declared
          #     fixture sets from (eslint/expected-fixtures.mjs).
          # tsconfig changes also land here: typed rules resolve their program
          # from it, so a project-shape change can move results in files the
          # diff never touched.
          LINT_ALL_RE='^(eslint\.config\.mjs$|eslint/|package\.json$|pnpm-lock\.yaml$|tsconfig[^/]*\.json$|vendor/|packages/activerecord/src/support/stubbed-ddl-methods\.ts$)'
          LINTABLE_RE='\.(m|c)?(t|j)sx?$'
          COMPARISON_RE='^(packages/|scripts/((api|test|fixtures|schema)-compare/|(build-rails-privates-manifest|build-rails-file-structure-manifest|rails-file-structure-mixins|rails-file-structure-collisions|deprecated-manifest-diff)\.ts$)|vendor/|docs/ruby-ts-conventions\.md$|eslint/rails-deprecated-methods\.json$)'
          force_all_affected() {
            echo "activerecord_affected=true" >> "$GITHUB_OUTPUT"
            echo "db_adapter_affected=true"   >> "$GITHUB_OUTPUT"
            echo "actionpack_affected=true"   >> "$GITHUB_OUTPUT"
            echo "actionview_affected=true"   >> "$GITHUB_OUTPUT"
            echo "rack_affected=true"         >> "$GITHUB_OUTPUT"
            echo "trailties_affected=true"    >> "$GITHUB_OUTPUT"
            echo "trails_tsc_affected=true"   >> "$GITHUB_OUTPUT"
            echo "tse_compiler_affected=true" >> "$GITHUB_OUTPUT"
            echo "unit_tests_affected=true"   >> "$GITHUB_OUTPUT"
            echo "guides_affected=true"       >> "$GITHUB_OUTPUT"
            echo "website_affected=true"      >> "$GITHUB_OUTPUT"
            echo "comparison_affected=true"   >> "$GITHUB_OUTPUT"
          }

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "prettier_files=__ALL__" >> "$GITHUB_OUTPUT"
            echo "lint_files=__ALL__" >> "$GITHUB_OUTPUT"
            force_all_affected
          elif ! files=$(git diff --name-only "$base"..."$head" 2>/dev/null); then
            echo "git diff failed (base may be unreachable after force-push) — running full matrix"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "prettier_files=__ALL__" >> "$GITHUB_OUTPUT"
            echo "lint_files=__ALL__" >> "$GITHUB_OUTPUT"
            force_all_affected
          else
            echo "Changed files:"
            echo "$files"
            if grep -qE '^(\.prettierrc\.json|\.prettierignore|package\.json)$' <<<"$files"; then
              echo "prettier_files=__ALL__" >> "$GITHUB_OUTPUT"
            elif pfiles=$(git diff --name-only --diff-filter=ACMR "$base"..."$head" 2>/dev/null); then
              {
                echo "prettier_files<<__PRETTIER_EOF__"
                echo "$pfiles"
                echo "__PRETTIER_EOF__"
              } >> "$GITHUB_OUTPUT"
            else
              echo "prettier_files=__ALL__" >> "$GITHUB_OUTPUT"
            fi
            # A type-aware rule (no-unnecessary-type-assertion &c.) reads
            # declarations in OTHER files, so narrowing a return type in one PR
            # can make an assertion in a file NO PR touched redundant. That file
            # is never re-linted, CI stays green, and `main` carries a lint error
            # every agent then hits locally. Lint the whole tree on every non-PR
            # event — the push to main that landed it, the weekly sweep,
            # workflow_dispatch — so the break surfaces with its file and rule in
            # the run itself. The per-PR changed-files scope is deliberately
            # untouched; a full-tree lint on every PR is what the scope exists to
            # avoid.
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "lint_files=__ALL__" >> "$GITHUB_OUTPUT"
            elif grep -qE "$LINT_ALL_RE" <<<"$files"; then
              echo "lint_files=__ALL__" >> "$GITHUB_OUTPUT"
            elif lfiles=$(git diff --name-only --diff-filter=ACMR "$base"..."$head" 2>/dev/null); then
              {
                echo "lint_files<<__LINT_EOF__"
                echo "$lfiles" | grep -E "$LINTABLE_RE" || true
                echo "__LINT_EOF__"
              } >> "$GITHUB_OUTPUT"
            else
              echo "lint_files=__ALL__" >> "$GITHUB_OUTPUT"
            fi
            if [ -z "$files" ]; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            elif grep -qvE '^docs/|^examples/|^README\.md$|^CLAUDE\.md$' <<<"$files"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            elif grep -qxF 'docs/ruby-ts-conventions.md' <<<"$files"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            fi
            case "${{ github.event_name }}" in
              push|schedule|workflow_dispatch)
                force_all_affected
                ;;
              *)
                if [ -z "$files" ]; then
                  echo "activerecord_affected=false" >> "$GITHUB_OUTPUT"
                  echo "db_adapter_affected=false"   >> "$GITHUB_OUTPUT"
                  echo "actionpack_affected=false"   >> "$GITHUB_OUTPUT"
                  echo "actionview_affected=false"   >> "$GITHUB_OUTPUT"
                  echo "rack_affected=false"         >> "$GITHUB_OUTPUT"
                  echo "trailties_affected=false"    >> "$GITHUB_OUTPUT"
                  echo "trails_tsc_affected=false"   >> "$GITHUB_OUTPUT"
                  echo "tse_compiler_affected=false" >> "$GITHUB_OUTPUT"
                  echo "unit_tests_affected=false"   >> "$GITHUB_OUTPUT"
                  echo "guides_affected=false"       >> "$GITHUB_OUTPUT"
                  echo "website_affected=false"      >> "$GITHUB_OUTPUT"
                  echo "comparison_affected=false"   >> "$GITHUB_OUTPUT"
                else
                  infra_files=$(echo "$files" | grep -vE "$INFRA_CARVEOUT_RE" || true)
                  # Herestrings, not `echo … | grep -q`: `grep -q` exits on its
                  # first match, so on a large diff `echo` is still writing when
                  # the reader vanishes and takes EPIPE. Under `pipefail` that
                  # makes the pipeline report failure BECAUSE the regex matched,
                  # and the gate silently inverts to false — a 756-file PR
                  # skipped Unit Tests and every AR lane that way (#7132).
                  set_gate() {
                    local name="$1" re="$2" excl="${3:-}" gate_files="$files"
                    if [ -n "$excl" ]; then gate_files=$(echo "$files" | grep -vE "$excl" || true); fi
                    if grep -qE "$INFRA_RE" <<<"$infra_files" || grep -qE "$re" <<<"$gate_files"; then
                      echo "${name}=true"  >> "$GITHUB_OUTPUT"
                    else
                      echo "${name}=false" >> "$GITHUB_OUTPUT"
                    fi
                  }
                  set_gate activerecord_affected "$AR_PKGS_RE"
                  set_gate db_adapter_affected   "$DB_ADAPTER_RE"
                  set_gate actionpack_affected   "$AP_PKGS_RE"
                  set_gate actionview_affected   "$AV_PKGS_RE"
                  set_gate rack_affected         "$RACK_PKGS_RE"
                  set_gate trailties_affected    "$TRAILTIES_PKGS_RE"
                  set_gate trails_tsc_affected   "$TRAILS_TSC_PKGS_RE"
                  set_gate tse_compiler_affected "$TSE_COMPILER_PKGS_RE"
                  set_gate unit_tests_affected   "$UNIT_TESTS_PKGS_RE"
                  set_gate guides_affected       "$GUIDES_PKGS_RE" "$GUIDES_EXCL_RE"
                  set_gate website_affected      "$WEBSITE_PKGS_RE"
                  set_gate comparison_affected   "$COMPARISON_RE" '^packages/website/'
                fi
                ;;
            esac
          fi
          case "${{ github.event_name }}" in
            pull_request)
              if echo "$PR_LABELS" | jq -e 'any(.[]; .name == "website" or .name == "release")' >/dev/null; then
                echo "website_label=true"  >> "$GITHUB_OUTPUT"
              else
                echo "website_label=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "website_label=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              echo "parity_sqlite=true"   >> "$GITHUB_OUTPUT"
              echo "parity_postgres=true" >> "$GITHUB_OUTPUT"
              echo "parity_mysql=true"    >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              for adapter in sqlite postgres mysql; do
                label="run-parity-${adapter}"
                if echo "$PR_LABELS" | jq -e --arg l "$label" 'any(.[]; .name == $l)' >/dev/null; then
                  echo "parity_${adapter}=true"  >> "$GITHUB_OUTPUT"
                else
                  echo "parity_${adapter}=false" >> "$GITHUB_OUTPUT"
                fi
              done
              ;;
            *)
              echo "parity_sqlite=false"   >> "$GITHUB_OUTPUT"
              echo "parity_postgres=false" >> "$GITHUB_OUTPUT"
              echo "parity_mysql=false"    >> "$GITHUB_OUTPUT"
              ;;
          esac

  # `vars.RUNNER` is a single runner label (e.g. `self-hosted` or
  # `ubuntu-latest`). GitHub treats `runs-on:` as one literal label when given
  # a string, so a comma-separated value like `self-hosted,Linux,X64` will
  # NOT match any runner. If a multi-label selector is ever needed, switch
  # this expression to `fromJSON(vars.RUNNER)` and store the variable as a
  # JSON array. Today the plan is to set it to exactly `self-hosted`.
  build-and-typecheck:
    name: Build & Type Check
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      - run: pnpm typecheck
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Lints only the changed files. `__ALL__` is the fallback sentinel from
      # the `changes` job — set whenever the diff couldn't be computed, on
      # push/schedule/dispatch, or when a changed file is an INPUT to a rule
      # rather than a file the rule reports on (LINT_ALL_RE there). Empty means
      # nothing ESLint is configured for changed.
      - name: ESLint
        env:
          LINT_FILES: ${{ needs.changes.outputs.lint_files }}
        run: |
          set -euo pipefail
          if [ "$LINT_FILES" = "__ALL__" ]; then
            pnpm lint
          elif [ -z "$LINT_FILES" ]; then
            echo "No changed files to lint."
          else
            printf '%s\n' "$LINT_FILES" | xargs -r -d '\n' pnpm run lint:files
          fi
  # Consolidated sub-minute PR/push preflight checks. Each of prettier,
  # docs-AR-freeze, and pr-attribution does a few seconds of independent shell
  # work; GitHub bills every job rounded UP to a whole minute, so running them
  # as three jobs cost 3 billed minutes for ~25s of compute. Folding them into
  # one job's sequential steps bills 1 minute while keeping each check's failure
  # independently legible in the step log. Each step preserves its original
  # event/author guard via a per-step `if:` so it no-ops (rather than skipping
  # the whole job) when its condition isn't met — prettier alone stays ungated
  # because, like the standalone job, it runs on every event. The guarded steps
  # prefix `!cancelled() &&` to defeat the implicit success() GitHub ANDs onto a
  # step `if:`, so an earlier step's failure can't skip a later guard — matching
  # the independent reporting the three replaced parallel jobs had.
  # Deliberately NOT folded into
  # `changes` — that job is on the critical path of every downstream gate, and a
  # prettier/attribution failure there would block gate computation.
  preflight:
    name: Preflight
    needs: changes
    # Needs the PR body for the attribution step; the diff-based steps need
    # full history (fetch-depth: 0) to diff against the PR base SHA.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: read for the two checkout-based steps (prettier reads the
      # tree, docs-AR-freeze diffs it); pull-requests: read for the attribution
      # step's `gh api repos/.../pulls` calls. Declaring `permissions:` zeroes
      # every unlisted scope, so contents must be listed explicitly even though
      # it is part of the default token.
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Single source of truth for the forbidden-attribution markers, shared by
      # the PR-body and commit-message scans below so the two can't drift apart.
      # Matched case-insensitively (grep -iE).
      ATTRIBUTION_RE: 'generated with \[?claude code|co-authored-by:[[:space:]]*claude|noreply@anthropic\.com|🤖 generated with'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # The prettier step runs via `npx` and never installs pnpm, but
          # setup-node v5 defaults `package-manager-cache: true` and would
          # try to cache the pnpm store from the `packageManager` field in
          # package.json — failing with "Unable to locate executable pnpm".
          package-manager-cache: false

      # Prettier. Unconditional, exactly as the standalone job was: it runs on
      # push and PR (the events that carry a meaningful diff) and also on the
      # weekly `schedule` sweep / `workflow_dispatch`, where the `changes` job
      # falls back to `prettier_files=__ALL__` and the whole tree is checked.
      # The two checks below need a per-step `if:` to no-op off `pull_request`;
      # prettier does not, so leaving it ungated keeps coverage identical to the
      # pre-consolidation job. The version below MUST equal the exact pin in
      # root `package.json` devDependencies; the `prettier` entry there is
      # intentionally pinned (no `^`) so CI and local `pnpm format` can never
      # drift. Checks only the files changed on this PR/push, not the whole
      # tree. `__ALL__` is the fallback sentinel from the `changes` job (diff
      # couldn't be computed); empty means nothing checkable changed.
      # `--ignore-unknown` skips paths Prettier has no parser for, and
      # `.prettierignore` is still honored.
      - name: Prettier
        env:
          PRETTIER_FILES: ${{ needs.changes.outputs.prettier_files }}
        run: |
          set -euo pipefail
          if [ "$PRETTIER_FILES" = "__ALL__" ]; then
            npx --yes prettier@3.8.1 --check .
          elif [ -z "$PRETTIER_FILES" ]; then
            echo "No changed files to check with Prettier."
          else
            printf '%s\n' "$PRETTIER_FILES" \
              | xargs -r -d '\n' npx --yes prettier@3.8.1 --check --ignore-unknown
          fi

      - name: Raw control bytes
        if: ${{ !cancelled() }}
        run: |
          scripts/ci/check-control-bytes.sh --self-test
          scripts/ci/check-control-bytes.sh

      # RFC 0087 Verification: the synchronous association-writer machinery the
      # campaign deleted stays deleted.
      - name: Sync association writers
        if: ${{ !cancelled() }}
        run: |
          scripts/ci/check-sync-association-writers.sh --self-test
          scripts/ci/check-sync-association-writers.sh

      # RFC 0011 Phase 4 guardrail. AR work tracking moved to the tasks repo;
      # `docs/activerecord/` is frozen so the two-source-of-truth split can't
      # self-heal. Fail any PR that adds or modifies a file under that path,
      # with a single allowlisted exception. PR-only: push/schedule have no PR
      # base to diff against. Only `docs/activerecord/` is policed — other
      # docs/ trees stay live until their own cutover.
      - name: Docs ActiveRecord Freeze
        # !cancelled() defeats the implicit success() that GitHub ANDs onto a
        # step `if:`, so an earlier step's failure (e.g. prettier) can't skip
        # this guard — preserving the independent reporting the three replaced
        # parallel jobs had.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The one tracker that stays under docs/activerecord/.
          ALLOWLIST='docs/activerecord/parity-verification.md'
          # Triple-dot: diff against the merge-base, not the base tip, so
          # unrelated commits merged to main since this branch diverged don't
          # show up. --diff-filter=ACMR ignores deletions (removing a tracker
          # is allowed). Path-scope to docs/activerecord/ so nothing else is
          # policed.
          changed=$(git diff --name-only --diff-filter=ACMR \
            "$BASE_SHA"..."$HEAD_SHA" -- docs/activerecord/ || true)
          offending=$(printf '%s\n' "$changed" \
            | grep -E '^docs/activerecord/' \
            | grep -vxF "$ALLOWLIST" || true)
          if [ -n "$offending" ]; then
            echo "::error::AR work tracking lives in the tasks repo — add a story, not a doc. Offending files:"
            printf '%s\n' "$offending"
            exit 1
          fi
          echo "No new or modified docs/activerecord trackers."

      # Closing-story citations. `stale-story-references` judges a landed
      # story's citations, but a story lands only after the merge — so a PR that
      # closes a story is blind to the check that reds main seconds later
      # (#7083, #5976). Gate it here instead: a PR declaring `Closes-story: <id>`
      # must carry no pending citation of `<id>`. Same scan, same extractor, so
      # a finding is a guaranteed red on main.
      - name: Set up pnpm (closing-story citations)
        # !cancelled() as above, so an earlier step's failure can't skip it.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/setup-pnpm
      - name: Closing-story citations
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm check:closing-story-refs --pr "$PR_NUMBER"

      # PR attribution check. Scoped to deanmarano-authored PRs: the project
      # forbids Claude attribution in *his* PR descriptions and commits (see
      # CLAUDE.md "Do NOT add ... Generated with Claude Code"). Other
      # contributors are unaffected; push/schedule have no PR body.
      - name: Forbid Claude attribution in PR body
        # !cancelled() so a prior step's failure can't suppress this guard
        # (see Docs ActiveRecord Freeze above).
        if: >-
          ${{ !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'deanmarano' }}
        run: |
          set -euo pipefail
          # Fetch the *live* body rather than reading the event payload. The
          # PR triggers don't include `edited`, so a body edit won't re-fire
          # CI — but a manual job re-run hits the API fresh and will see the
          # fix. Reading the payload would replay the stale original body and
          # leave the check permanently red.
          body=$(scripts/ci/gh-api-retry.sh "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')
          if grep -qiE "$ATTRIBUTION_RE" <<<"$body"; then
            echo "::error::PR body contains Claude attribution. Remove 'Generated with Claude Code' / 'Co-Authored-By: Claude' / Anthropic attribution lines (see CLAUDE.md), then re-run this job."
            exit 1
          fi
          echo "No forbidden Claude attribution found in PR body."
      - name: Forbid Claude attribution in commit messages
        # !cancelled() so a prior step's failure can't suppress this guard
        # (see Docs ActiveRecord Freeze above).
        if: >-
          ${{ !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'deanmarano' }}
        run: |
          set -euo pipefail
          # See the body guard above: retry transient API failures so a 5xx
          # can't masquerade as an attribution hit.
          # Scan every commit message on the PR, not just the PR body. The body
          # check above misses `Co-authored-by:` trailers that live in commits —
          # and GitHub's squash-merge auto-aggregates those branch-commit
          # trailers into the merge commit on `main`, which is exactly how a
          # Claude attribution reached main past the body check.
          #
          # The pulls/{n}/commits endpoint caps at 250 commits even with
          # --paginate, so a >250-commit PR would leave its tail unscanned. Fail
          # closed in that case rather than passing on a partial scan — this repo
          # squashes and PRs are size-capped, so 250 commits never happens
          # legitimately; if it does, squash/rebase before re-running.
          count=$(scripts/ci/gh-api-retry.sh "repos/$REPO/pulls/$PR_NUMBER" --jq '.commits')
          if [ "$count" -gt 250 ]; then
            echo "::error::PR has $count commits, exceeding the 250-commit API scan cap. Squash or rebase the branch so commit messages can be fully scanned, then re-run this job."
            exit 1
          fi
          messages=$(scripts/ci/gh-api-retry.sh --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[].commit.message')
          if grep -qiE "$ATTRIBUTION_RE" <<<"$messages"; then
            echo "::error::A commit message contains Claude attribution. Remove 'Generated with Claude Code' / 'Co-Authored-By: Claude' / Anthropic attribution lines from your commits (see CLAUDE.md) — note that squash-merge folds commit trailers into main — then re-run this job."
            exit 1
          fi
          echo "No forbidden Claude attribution found in commit messages."

  # Off on PRs entirely. This is a documentation-drift gate — guide snippets vs.
  # the public type surface — not review signal, and GUIDES_PKGS_RE spans every
  # AR-adjacent package, so it fired on nearly every source PR to tell nobody
  # anything. It runs on `main`, on the Monday sweep (where `changes` forces
  # every gate true), on `workflow_dispatch`, and on a PR labelled
  # `run-guides`. It is in the `ci` aggregator's `needs:`, so whenever it does
  # run a failure blocks the merge; drift introduced by a PR is caught by the
  # push-to-main run and the weekly sweep instead of by that PR.
  guides-typecheck:
    name: Guides Code Type Check
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.guides_affected == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-guides'))
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      - run: pnpm guides:typecheck

  virtualized-dx-type-tests:
    name: Virtualized DX Type Tests
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.activerecord_affected == 'true' ||
      needs.changes.outputs.trails_tsc_affected == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test:types:virtualized

  unit-tests:
    name: Unit Tests
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.unit_tests_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # scripts/stale-story-references.test.ts compares story citations in
      # comments against real story statuses; the story markdown is the source
      # of truth and the check throws without it, so the (public) tasks repo is
      # checked out where resolveTasksDir looks.
      - uses: actions/checkout@v5
        with:
          repository: blazetrailsdev/tasks
          path: tasks
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      # scripts/parity/pipeline/query/node spawns the dump runners as real subprocesses;
      # they resolve @blazetrails/* through package `main` entries, so the
      # dist/ trees have to exist before vitest starts.
      - run: pnpm build
      # The scripts/* suites added here are the compare tooling's own unit
      # tests; none needs Ruby or the `pnpm build` above (that step exists for
      # parity/query/node, which #5264 already wired in — the whole
      # scripts/parity tree now passes, so one filter covers it).
      # scripts/schema-compare is the one suite that belongs elsewhere: it
      # parses the REAL vendored test/schema/schema.rb, so it runs as a step of
      # rails-comparison, the job that fetches vendor/.
      - run: >
          pnpm vitest run
          packages/arel
          packages/activemodel
          packages/activesupport
          packages/date
          packages/i18n
          packages/ruby-compat
          scripts/guides-typecheck
          scripts/tasks
          scripts/api-compare
          scripts/test-compare
          scripts/fixtures-compare
          scripts/test-deps
          scripts/rails-find
          scripts/sync-stats
          scripts/parity
          eslint/
          scripts/strip-asany.test.ts
          scripts/tasks-shim.test.ts
          scripts/rails-file-structure-mixins.test.ts
          scripts/rails-file-structure-collisions.test.ts
          scripts/deprecated-manifest-diff.test.ts
          scripts/ci-suite-coverage.test.ts
          scripts/mixin-declaration-drift.test.ts
          scripts/mysql-grant-namespaces.test.ts
          scripts/stale-story-references.test.ts
          scripts/closing-story-references.test.ts
          scripts/non-transactional-row-writes.test.ts
          scripts/generate-canonical-zone-identifiers.test.ts
          scripts/generate-tzdata-isdst.test.ts
          vendor/sources.test.ts

  # Consolidated leaf-test job. The cheapest sub-minute leaf suites — rack
  # (~27 s), actionview (~26 s), tse-compiler (~22 s), and the DX type tests
  # (~30 s) — each bill a full rounded-up minute when run as separate jobs.
  # Collapsing them into one job shares a single checkout/install and emits one
  # billed minute instead of up to four. Each suite is individually `if:`-gated
  # on its own affected flag so an unaffected package is skipped inside the job;
  # the job as a whole runs when ANY member flag is true. actionpack (~50 s) and
  # trailties (~42 s) are deliberately left standalone: their wall-clocks risk
  # pushing the combined job past ~2 billed minutes, which would erase the
  # rounding win.
  leaf-tests:
    name: Leaf Tests
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.rack_affected == 'true' ||
      needs.changes.outputs.actionview_affected == 'true' ||
      needs.changes.outputs.tse_compiler_affected == 'true' ||
      needs.changes.outputs.activerecord_affected == 'true' ||
      needs.changes.outputs.trailties_affected == 'true')
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - id: install
        run: pnpm install --frozen-lockfile --prefer-offline
      # Each suite is gated on the install step succeeding rather than on the
      # default success()-of-all-prior-steps. This preserves the old
      # separate-job behaviour where every affected leaf ran and reported
      # independently: a failure in one leaf no longer skips the others, so a
      # multi-leaf PR surfaces all failures in one run instead of discovering
      # them one re-run at a time. The job still fails if any step fails.
      - name: Rack tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.changes.outputs.rack_affected == 'true' }}
        run: pnpm vitest run packages/rack
      - name: Action View tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.changes.outputs.actionview_affected == 'true' }}
        run: pnpm vitest run packages/actionview
      - name: TSE Compiler tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.changes.outputs.tse_compiler_affected == 'true' }}
        run: pnpm vitest run packages/tse-compiler
      # vitest.dx-tests.config.ts only declares activerecord and trailties
      # projects, so this runs when either is affected.
      - name: DX type tests
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' &&
          (needs.changes.outputs.activerecord_affected == 'true' ||
          needs.changes.outputs.trailties_affected == 'true') }}
        run: pnpm test:types

  actionpack-tests:
    name: Action Pack Tests
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.actionpack_affected == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm vitest run packages/actionpack

  trailties-tests:
    name: Trailties Tests
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.trailties_affected == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm vitest run packages/trailties

  # Reporting-only code coverage. Runs the light (non-AR) packages together
  # with v8 coverage and `--coverage.all` so untested files count toward the
  # denominator, producing an honest baseline. There is NO threshold gate —
  # `continue-on-error: true` plus the no-threshold vitest config mean this job
  # can never block a merge. The summary is written to the run UI and the
  # lcov/json reports are uploaded as artifacts. activerecord is deliberately
  # excluded (its 6-fork suite dominates CI time); AR coverage is a follow-up.
  # trails-tsc is excluded from THIS shared run: its watcher/build tests spawn
  # subprocesses that are coverage-hostile under load and can trip vitest's
  # worker-RPC timeout — which aborts the whole run and writes no report,
  # voiding every other package's numbers. It gets its own coverage signal from
  # the isolated `trails-tsc-coverage` job below, where such a timeout can only
  # void trails-tsc's own report.
  coverage:
    name: Coverage (reporting-only)
    needs: changes
    if: false
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run vitest with coverage (non-AR packages)
        run: >
          pnpm vitest run
          packages/arel
          packages/activemodel
          packages/activesupport
          packages/date
          packages/did-you-mean
          packages/globalid
          packages/i18n
          packages/nokogiri
          packages/html-sanitizer
          packages/rack
          packages/actionpack
          packages/actionview
          packages/trailties
          packages/tse-compiler
          --coverage --coverage.all
      - name: Write coverage summary to run UI
        if: always()
        run: node scripts/ci/coverage-summary.mjs
      - name: Upload coverage report (lcov + json)
        # Reporting-only: a transient artifact-service upload timeout must not
        # turn this non-gating job red (see RFC 0061-ci-failures).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 14

  sqlite-tests:
    name: Active Record SQLite Tests
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.activerecord_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      # Trailing slash is load-bearing: the bare `packages/activerecord` filter
      # is a substring match that also sweeps in packages/activerecord-cli/**.
      # Those already run in the dedicated step below, so the slash avoids a
      # redundant double-run and keeps the CLI's subprocess tests out of this
      # large suite's worker scheduler (they otherwise starve its reporter RPC
      # / perturb fork scheduling — see trails-models-dump tests).
      # Both suites below import activerecord — scripts/test-deps from src,
      # scripts/parity/pipeline/query/node through the dump runners it spawns — yet ride
      # the unit_tests_affected gate, which the AR tree is off. This is the only
      # job that runs them on an AR-only PR. Separate invocation from the AR
      # suite on purpose: it keeps them in the `other` vitest project, whose
      # lack of AR setupFiles is what reproduces the TDZ entry order.
      # scripts/mixin-declaration-drift.test.ts rides the same gate for the same
      # reason: it guards the declaration-merged interfaces in
      # packages/activerecord/src/connection-adapters/, so the PR that can
      # introduce the drift is exactly the PR unit_tests_affected does not
      # fire on. Running it here costs one extra file in a job that is already
      # running, rather than pulling the whole ~10.5k-test unit job onto every
      # activerecord PR.
      # (Guard: scripts/ci-suite-coverage.test.ts.)
      - run: pnpm vitest run scripts/test-deps scripts/parity/pipeline/query/node scripts/mixin-declaration-drift.test.ts
      - run: pnpm vitest run packages/activerecord/
      - run: pnpm vitest run packages/activerecord-cli

  # `ARCONN=sqlite3_mem` is the only lane where `in_memory_db?` is true, so
  # without it every `skipIf(inMemoryDb())` guard is dead code (RFC 0029).
  #
  # A second full pass over the AR suite, so not on every PR: it runs on `main`,
  # on the Monday sweep (where `changes` forces every gate true), on
  # `workflow_dispatch`, and on a PR labelled `run-sqlite-mem`. It is in the `ci`
  # aggregator's `needs:`, so whenever it does run a failure blocks the merge.
  sqlite-mem-tests:
    name: "Active Record SQLite :memory: Tests"
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.activerecord_affected == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-sqlite-mem'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      # Trailing slash for the reason given on `sqlite-tests`. The CLI package
      # is excluded: it owns no `inMemoryDb()` guards, so it has nothing this
      # lane can check.
      - run: pnpm vitest run packages/activerecord/
        env:
          ARCONN: sqlite3_mem

  # Reporting-only AR coverage (story ar-sqlite-lane-coverage-reporting, RFC
  # 0028). Runs the sqlite AR suite (the cheapest backend) with v8 coverage and
  # publishes the numbers to the run UI + lcov/json artifacts. This is a
  # SEPARATE, non-blocking job rather than a `--coverage` flag bolted onto
  # `sqlite-tests`, because a local micro-benchmark measured the flag adding
  # ~37% to vitest wall time — material slowdown for a job that gates merges
  # (sqlite-tests is in the `ci` aggregator's `needs:`). Keeping coverage in its
  # own `continue-on-error` job off the `ci` needs-graph means it can never slow
  # the critical path or block a merge; the no-threshold vitest config means it
  # can never fail on low coverage either. Mirrors the light-package `coverage`
  # job above.
  ar-sqlite-coverage:
    name: Active Record SQLite Coverage (reporting-only)
    needs: changes
    if: false
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      # AR_COVERAGE=1 scopes the vitest coverage include to activerecord source
      # (see vitest.config.ts). Only the main AR suite is covered; the cli run
      # is intentionally omitted so it can't clobber the report.
      - run: pnpm vitest run packages/activerecord/ --coverage --coverage.all
        env:
          AR_COVERAGE: "1"
      - name: Write AR coverage summary to run UI
        if: always()
        run: node scripts/ci/coverage-summary.mjs
      - name: Upload AR coverage report (lcov + json)
        # Reporting-only: a transient artifact-service upload timeout must not
        # turn this non-gating job red (see RFC 0061-ci-failures).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ar-coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 14

  # Reporting-only activerecord-cli coverage (story ar-cli-coverage-reporting,
  # RFC 0028). A SEPARATE non-blocking job from ar-sqlite-coverage: a second
  # `pnpm vitest run` against the shared ./coverage dir would clobber the AR
  # report, so the cli numbers get their own job + artifact. AR_CLI_COVERAGE=1
  # scopes coverage to activerecord-cli source (see vitest.config.ts). Off the
  # `ci` aggregator's needs-graph and `continue-on-error`, so it can never block
  # a merge; the no-threshold vitest config means it can never fail on low
  # coverage either.
  ar-cli-coverage:
    name: Active Record CLI Coverage (reporting-only)
    needs: changes
    if: false
    continue-on-error: true
    runs-on: ubuntu-latest
    # TRAILS_TEST_FORKS=1 serializes the cli suite onto one worker (see below),
    # and its trails-tsc E2E tests run heavy tsc compiles under v8 coverage on a
    # 2-vCPU runner, so allow more wall time than the multi-fork trails-tsc job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      # The cli suite's trails-tsc E2E tests spawn tsc subprocesses that, under
      # v8 instrumentation, trip vitest's `onTaskUpdate` worker-RPC timeout and
      # abort the run. Mirror the trails-tsc job: TRAILS_TEST_FORKS=1 cuts fork
      # contention, --test-timeout=60000 absorbs the slower compiles, and a
      # residual timeout is swallowed by dangerouslyIgnoreUnhandledErrors (gated
      # on AR_CLI_COVERAGE in vitest.config.ts). Reporting-only (no thresholds).
      - run: pnpm vitest run packages/activerecord-cli --coverage --coverage.all --test-timeout=60000
        env:
          AR_CLI_COVERAGE: "1"
          TRAILS_TEST_FORKS: "1"
      - name: Write AR CLI coverage summary to run UI
        if: always()
        run: node scripts/ci/coverage-summary.mjs
      - name: Upload AR CLI coverage report (lcov + json)
        # Reporting-only: a transient artifact-service upload timeout must not
        # turn this non-gating job red (see RFC 0061-ci-failures).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ar-cli-coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 14

  trails-tsc-tests:
    name: trails-tsc Tests
    needs: changes
    # Gated like trails-tsc-coverage below: trails-tsc is the covered source and
    # tse-compiler is what its tests exercise.
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.trails_tsc_affected == 'true' ||
      needs.changes.outputs.tse_compiler_affected == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Blocking gate for trails-tsc's runtime unit tests. Deliberately plain:
      # no --coverage, so the v8 instrumentation that pegs a worker long enough
      # to trip vitest's `onTaskUpdate` worker-RPC timeout is absent, and
      # dangerouslyIgnoreUnhandledErrors (gated on TRAILS_TSC_COVERAGE in
      # vitest.config.ts) stays OFF — an unhandled error is real signal here.
      # TRAILS_TEST_FORKS=1 removes fork contention and --test-timeout=60000
      # absorbs the heavy tsc compiles these tests drive.
      - run: pnpm vitest run packages/trails-tsc --test-timeout=60000
        env:
          TRAILS_TEST_FORKS: "1"

  trails-tsc-coverage:
    name: trails-tsc Coverage (reporting-only)
    needs: changes
    # Gated like the per-area ar-sqlite-coverage job: only run when trails-tsc
    # (the covered source) or tse-compiler (which its tests exercise) changed,
    # so this dedicated job doesn't add cost to unrelated PRs. Not in `ci`'s
    # `needs`, so a skip here never trips the all-jobs gate.
    if: false
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # trails-tsc is isolated in its own job: its watcher/build tests spawn
      # subprocesses and run heavy tsc compiles that, under v8 instrumentation,
      # peg a worker long enough to trip vitest's `onTaskUpdate` worker-RPC
      # timeout, aborting the run and writing no report. Running alone means
      # such a timeout can only void THIS report, never the shared non-AR
      # coverage run. TRAILS_TSC_COVERAGE=1 scopes coverage to trails-tsc
      # source; TRAILS_TEST_FORKS=1 reduces the fork contention that worsens the
      # timeout (a residual one is absorbed by dangerouslyIgnoreUnhandledErrors
      # in vitest.config.ts, gated on the same flag); --test-timeout=60000
      # absorbs the slower tsc compiles. Reporting-only (no thresholds → never
      # fails the build).
      - run: pnpm vitest run packages/trails-tsc --coverage --coverage.all --test-timeout=60000
        env:
          TRAILS_TSC_COVERAGE: "1"
          TRAILS_TEST_FORKS: "1"
      - name: Write trails-tsc coverage summary to run UI
        if: always()
        run: node scripts/ci/coverage-summary.mjs
      - name: Upload trails-tsc coverage report (lcov + json)
        # Reporting-only: a transient artifact-service upload timeout must not
        # turn this non-gating job red (see RFC 0061-ci-failures).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trails-tsc-coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 14

  postgres-tests:
    name: Active Record PostgreSQL Tests
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.activerecord_affected == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      needs.changes.outputs.db_adapter_affected == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'run-db-adapters'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 2-way file-level shard (RFC 0028 shard-ar-adapter-suites). This suite is
    # the CI critical path; vitest --shard splits the file set across two free
    # hosted legs that run concurrently, roughly halving wall time. Each matrix
    # leg gets its own fresh service container automatically. The `needs` graph
    # keys on the job id (`postgres-tests`), so the `ci` aggregator sees one
    # merged result for both legs — no allowlist change needed. The
    # activerecord-cli E2E step is not sharded, so it runs on shard 1 only (see
    # its per-step `if:`) to avoid a redundant double-run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      # tmpfs: the data dir is mounted in RAM so Postgres' per-DDL fsync
      # traffic (WAL flushes + checkpoints) never hits disk. This suite is
      # DDL-heavy (lots of createTable/dropTable per file across 8 parallel
      # forks), so durability fsync is a real CI cost. Mirrors the MariaDB
      # stand-in runner below, where a side-by-side experiment measured tmpfs
      # at ~7m45s vs ~9m23s (~17% faster) on this same suite. The DB is
      # throwaway per-run, so losing it on container stop is fine.
      #
      # --mount is a `docker create` flag, so it goes in options. We can't pass
      # server tuning args (-c fsync=off, -c synchronous_commit=off, etc.) here:
      # GitHub Actions service containers support neither a `command:` key nor
      # appending command args via options (options only accepts `docker create`
      # flags, not args forwarded to the image entrypoint), and only a custom
      # image could set them. With the data dir already on tmpfs those flags add
      # little — fsync lands in RAM regardless. POSTGRES_INITDB_ARGS=--no-sync
      # is the one initdb-time knob env vars can reach, skipping the fsync at
      # cluster init (safe because the cluster is disposable).
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: activerecord_unittest
          POSTGRES_USER: postgres
          # Rails' postgresql: entries carry no credential at all
          # (config.example.yml:74-81) and its rake db:postgresql:build runs
          # createdb as the local user. trust reproduces that over TCP: the
          # passwordless `rails` role provisioned below can connect without a
          # password. The container is throwaway per-run.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--no-sync"
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      # Service containers can't mount /docker-entrypoint-initdb.d, so feed the
      # compose init script by hand — same file, so CI and local provisioning
      # can't drift.
      - name: Provision Rails' test role
        run: |
          psql -h localhost -U postgres -d activerecord_unittest \
            -v ON_ERROR_STOP=1 -f scripts/db-init/postgres/01-rails-role.sql
      # PostgreSQLStructureDumpTest#test_structure_dump runs the real pg_dump
      # (postgresql_rake_test.rb:333-343) — every other case in that class stubs
      # Kernel.system. psql happily talks to a newer server, so the step above
      # works on the runner's preinstalled client, but pg_dump aborts outright
      # when the server is newer than it, and the service is postgres:17. Pull
      # the matching client from PGDG so the dump runs.
      - name: Install a pg_dump matching the server major
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version
      # Trailing slash is load-bearing: the bare `packages/activerecord` filter
      # is a substring match that also sweeps in packages/activerecord-cli/**.
      # Those already run in the dedicated step below, so the slash avoids a
      # redundant double-run and keeps the CLI's subprocess tests out of this
      # large suite's worker scheduler (they otherwise starve its reporter RPC
      # / perturb fork scheduling — see trails-models-dump tests).
      - run: pnpm vitest run packages/activerecord/ --shard=${{ matrix.shard }}/2
        env:
          ARCONN: postgresql
          PGHOST: localhost
          PGPORT: "5432"
          # PGDATABASE is deliberately unset: the database comes from
          # ARTest.expand_config (test/support/config.rb:28-34), not libpq's env.
          PGUSER: rails
          # AR_DB_FORKS deliberately unset: vitest.config.ts derives both the
          # worker count and the slot-DB pool from the runner's vCPU count.
      # CLI E2E is not sharded — run it once, on shard 1 only, to avoid a
      # redundant double-run across the two legs.
      # PG_TEST_URL is the activerecord-cli E2E's own input (it drives the CLI's
      # --database-url flag), not the activerecord harness's backend selector.
      # It stays a URL because that is literally what the CLI takes.
      - if: ${{ matrix.shard == 1 }}
        run: pnpm vitest run packages/activerecord-cli
        env:
          PG_TEST_URL: postgres://rails@localhost:5432/activerecord_unittest

  mysql-tests:
    name: Active Record MySQL Tests
    needs: changes
    # TEMPORARILY DISABLED. mysql:8 fsyncs every DDL to disk and ran ~2.15x
    # slower than mariadb:11 on this DDL-heavy suite, dominating PR cycle
    # time. The maria-tests-* jobs below stand in for MySQL/MariaDB coverage
    # while this is parked. To re-enable, delete the leading `false &&` from
    # the `if:` below. The aggregate `ci` job already treats this job's skip
    # as always-legitimate (see the mysql-tests case there).
    if: >-
      false &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.activerecord_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: activerecord_unittest
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        # mysql:8 fsyncs every DDL/commit to disk (transactional data
        # dictionary + doublewrite + redo), which dominates this DDL-heavy
        # suite — the activerecord vitest step ran ~2.15x slower than it did
        # on mariadb:11 (~400s -> ~860s). Mounting the data dir as tmpfs sends
        # all that durability traffic to RAM; the DB is throwaway per-run so
        # losing it on container stop is fine. --mount is a `docker create`
        # flag, so it goes here in options (service containers can't override
        # the image command to pass server args directly).
        options: >-
          --mount type=tmpfs,destination=/var/lib/mysql
          --health-cmd "mysqladmin ping -h localhost --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      # Service containers can't mount /docker-entrypoint-initdb.d, so feed the
      # compose init script by hand — same file, so CI and local provisioning
      # can't drift.
      - name: Provision Rails' test user
        run: mysql -h 127.0.0.1 -uroot < scripts/db-init/mysql/01-rails-user.sql
      # Trailing slash is load-bearing: the bare `packages/activerecord` filter
      # is a substring match that also sweeps in packages/activerecord-cli/**.
      # Those already run in the dedicated step below, so the slash avoids a
      # redundant double-run and keeps the CLI's subprocess tests out of this
      # large suite's worker scheduler (they otherwise starve its reporter RPC
      # / perturb fork scheduling — see trails-models-dump tests).
      - run: pnpm vitest run packages/activerecord/
        env:
          ARCONN: mysql2
          MYSQL_HOST: localhost
          MYSQL_PORT: "3306"
          # AR_DB_FORKS deliberately unset: vitest.config.ts derives both the
          # worker count and the slot-DB pool from the runner's vCPU count.
      - run: pnpm vitest run packages/activerecord-cli
        env:
          MYSQL_TEST_URL: mysql://rails@localhost:3306/activerecord_unittest

  # MariaDB stand-in runner. mysql-tests is temporarily disabled (see above);
  # this provides MySQL/MariaDB-family coverage via the mysql2 adapter against
  # MariaDB, which runs far faster than mysql:8 on this DDL-heavy suite. Gates
  # on the same activerecord_affected trigger the mysql job used. Rails'
  # devcontainer tracks `mariadb:latest`; we pin to `mariadb:11` (current LTS
  # line) for reproducible CI.
  #
  # tmpfs: the data dir is mounted in RAM so MariaDB's per-DDL fsync traffic
  # never hits disk. A side-by-side CI experiment measured tmpfs at ~7m45s vs
  # ~9m23s on normal storage (~17% faster) on this suite, so we keep tmpfs.
  # The DB is throwaway per-run, so losing it on container stop is fine.
  # --mount is a `docker create` flag, so it goes in options (service
  # containers can't override the image command to pass server args directly).
  # Draft-deferred with postgres-tests. Both stay in the `ci` aggregator's
  # `needs:` and `ci` is the branch-protection target, so this moves adapter
  # coverage in time, not extent.
  maria-tests:
    name: Active Record MariaDB Tests
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.activerecord_affected == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false ||
      needs.changes.outputs.db_adapter_affected == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'run-db-adapters'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 2-way file-level shard (RFC 0028 shard-ar-adapter-suites) — see the
    # postgres-tests job above for the rationale. Each matrix leg gets its own
    # fresh MariaDB service container; the `needs` graph keys on the job id, so
    # the `ci` aggregator sees one merged result for both legs.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: activerecord_unittest
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --mount type=tmpfs,destination=/var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      # Service containers can't mount /docker-entrypoint-initdb.d, so feed the
      # compose init script by hand — same file, so CI and local provisioning
      # can't drift.
      - name: Provision Rails' test user
        run: mysql -h 127.0.0.1 -uroot < scripts/db-init/mysql/01-rails-user.sql
      # Trailing slash is load-bearing: the bare `packages/activerecord` filter
      # is a substring match that also sweeps in packages/activerecord-cli/**.
      # Those already run in the dedicated step below, so the slash avoids a
      # redundant double-run and keeps the CLI's subprocess tests out of this
      # large suite's worker scheduler (they otherwise starve its reporter RPC
      # / perturb fork scheduling — see trails-models-dump tests).
      - run: pnpm vitest run packages/activerecord/ --shard=${{ matrix.shard }}/2
        env:
          ARCONN: mysql2
          MYSQL_HOST: localhost
          MYSQL_PORT: "3306"
          # AR_DB_FORKS deliberately unset: vitest.config.ts derives both the
          # worker count and the slot-DB pool from the runner's vCPU count.
      # CLI E2E is not sharded — run it once, on shard 1 only.
      - if: ${{ matrix.shard == 1 }}
        run: pnpm vitest run packages/activerecord-cli
        env:
          MYSQL_TEST_URL: mysql://rails@localhost:3306/activerecord_unittest

  # A second full pass over the AR suite, so off the per-PR/per-merge critical
  # path entirely: it runs on the Monday sweep, on `workflow_dispatch`, and on a
  # PR labelled `run-mysql-prepared` — never on a push to `main`, never on an
  # unlabelled PR. It is in the `ci` aggregator's `needs:`, so whenever it does
  # run a failure blocks the merge; when it legitimately doesn't run the
  # aggregator treats the skip as "not required here". Unsharded (hence the
  # wider timeout): off the critical path, one runner is the cheaper trade.
  maria-prepared-tests:
    name: Active Record MariaDB Tests (prepared statements)
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.activerecord_affected == 'true' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-mysql-prepared')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: activerecord_unittest
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --mount type=tmpfs,destination=/var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      - name: Provision Rails' test user
        run: |
          mysql -h 127.0.0.1 -uroot -e "
            CREATE USER IF NOT EXISTS 'rails'@'%';
            GRANT ALL PRIVILEGES ON *.* TO 'rails'@'%';
            CREATE USER IF NOT EXISTS 'rails'@'localhost';
            GRANT ALL PRIVILEGES ON *.* TO 'rails'@'localhost';
            FLUSH PRIVILEGES;"
      - run: pnpm vitest run packages/activerecord/
        env:
          ARCONN: mysql2
          MYSQL_HOST: localhost
          MYSQL_PORT: "3306"
          MYSQL_PREPARED_STATEMENTS: "1"

  website:
    name: Website
    needs: changes
    # TEMPORARILY DISABLED. The build has been failing on main and the job
    # doesn't run on ordinary PRs, so nothing catches the breakage before it
    # lands; the site being stale is acceptable for now. To re-enable, delete
    # the leading `false &&` from the `if:` below. The aggregate `ci` job
    # already treats this job's skip as always-legitimate (see the website
    # case there).
    if: >-
      false &&
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.website_affected == 'true' ||
      needs.changes.outputs.website_label == 'true')
    # Stays on hosted: SvelteKit + VitePress + typedoc build is too slow
    # on the self-hosted box and ties up a runner slot that cheaper jobs
    # could use. Hosted parallelism is free.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache VitePress + Vite build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/website/docs/.vitepress/cache
            packages/website/node_modules/.vite
          key: vitepress-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/website/docs/.vitepress/config.ts') }}
      - run: pnpm --filter @blazetrails/website exec svelte-kit sync
      - name: Unit-test docs build scripts
        run: pnpm --filter @blazetrails/website exec vitest run scripts/
      - name: Build SvelteKit
        run: pnpm --filter @blazetrails/website run build:sw && pnpm --filter @blazetrails/website exec vite build
      - name: Build docs (typedoc + VitePress)
        run: pnpm --filter @blazetrails/website run docs:build

  rails-comparison:
    name: Rails API/Test Comparison
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.comparison_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/cache-build
      - run: pnpm build
      - name: Cache vendored upstream Ruby sources
        uses: actions/cache@v4
        with:
          # Cache only the gitignored clones (vendor/*/), not tracked files
          # under vendor/. Caching vendor/ wholesale would restore stale
          # versions of vendor/README.md / fetch.ts / sources.ts on top of
          # the checkout when a PR changes one of those without bumping the
          # cache key.
          path: vendor/*/
          # Invalidates when sources.ts (declared refs) or sources.lock.json
          # (resolved SHAs) change. fetch.ts checksum keeps the cache fresh
          # if the fetcher logic itself changes.
          # Exact-match only — no restore-keys. A partial restore of an older
          # cache would produce a vendor/<source>/.git/HEAD that doesn't match
          # the current sources.lock.json, and vendor/fetch.ts would abort
          # rather than silently re-fetch.
          key: vendor-sources-${{ hashFiles('vendor/sources.ts', 'vendor/sources.lock.json', 'vendor/fetch.ts') }}
      - name: Fetch upstream Ruby sources
        run: pnpm vendor:fetch
      - name: Extract Ruby API
        run: cd scripts/api-compare && LIB_PATHS_JSON=$(pnpm -s -C ../.. vendor:fetch --print-lib-paths) LOCKFILE_PATH=$GITHUB_WORKSPACE/vendor/sources.lock.json ruby extract-ruby-api.rb
      - name: Extract Ruby tests
        run: cd scripts/test-compare && TEST_PATHS_JSON=$(pnpm -s -C ../.. vendor:fetch --print-test-paths) ruby extract-ruby-tests.rb
      - name: API comparison
        run: pnpm exec tsx scripts/api-compare/extract-ts-api.ts && pnpm exec tsx scripts/api-compare/compare.ts
      - name: API comparison (privates)
        run: pnpm exec tsx scripts/api-compare/compare.ts --privates
      - name: Extra-surface tag gates
        # RFC 0072. Fails on a STALE `@noRailsEquivalent` (tag on a name that no
        # longer flags), a reason stating neither PERMANENT nor CONVERGEABLE, or
        # a refused file-level tag. Rides this job because the gates read the
        # api-compare manifests the step above already wrote. No --exclude-glob:
        # an exclusion disarms the stale gate (see extra-surface.ts `main()`).
        run: pnpm exec tsx scripts/api-compare/extra-surface.ts
      - name: Legacy compare-script name gate
        # RFC 0092. Fails on any retired compare-script spelling reintroduced
        # anywhere outside vendor/rails and build output — the aliases in the
        # root package.json are a shim for out-of-repo callers, not a licence to
        # write the old names. The fix is the parity:* spelling, never a new
        # allowlist row. Read-only; needs no Ruby or artifact.
        run: pnpm exec tsx scripts/parity/lint-legacy-script-names.ts
      - name: Arity excludes gate
        # Fails on a malformed or STALE entry in
        # scripts/api-compare/arity-exclude.json (the reasoned suppression file
        # for the advisory arity check, applied by the API comparison step
        # above). Excludes only shrink — delete a converged entry by hand.
        run: pnpm exec tsx scripts/api-compare/lint-arity-excludes.ts
      - name: Inheritance excludes gate
        # Fails on a malformed or STALE entry in
        # scripts/api-compare/inheritance-exclude.json (the reasoned suppression
        # file for the inheritance check, applied by the API comparison step
        # above). Excludes only shrink — delete a converged entry by hand.
        run: pnpm exec tsx scripts/api-compare/lint-inheritance-excludes.ts
      - name: Missing-call reasons gate
        # Enforces the `@missingRailsCall` empty-reason contract (the same
        # `parseJsdoc` check `parity:api:build` uses) over every JSDoc block
        # under packages/*/src. Read-only and artifact-free: `parity:api:build`
        # itself is opt-in and rewrites files, so without this step a
        # hand-authored bare tag would sit undetected. See the bullet in
        # docs/infrastructure/api-build-stub-generation-plan.md.
        run: pnpm exec tsx scripts/api-compare/lint-missing-rails-call-reasons.ts
      - name: Detached JSDoc tag blocks gate
        # Flags `@internal` / `@noRailsEquivalent` blocks separated from the
        # declaration they document (a `//` comment between the block and the
        # signature is the usual shape). The tag then stops applying to that
        # declaration — the member reads as unjustified public surface, or the
        # tag excuses a neighbour it was never written for, and both look
        # exactly like "no tag was written". Read-only; no Ruby needed.
        run: pnpm exec tsx scripts/api-compare/lint-detached-jsdoc-tags.ts
      - name: Body-pins gate
        # Source-hash pinning (RFC 0025). Fails when a pinned pair's normalized
        # Rails body digest drifts from the current vendored source
        # (output/body-hashes.json, written by the API comparison step above)
        # or when a pin no longer resolves. Re-pin after re-verifying with
        # `pnpm tsx scripts/api-compare/body-pins.ts --pin <ruby-file>`.
        run: pnpm exec tsx scripts/api-compare/lint-body-pins.ts
      - name: API comparison (calls)
        # Writes the call-set artifact (output/call-mismatches.json) over
        # SIGNIFICANT_CALLS (all ported names except `super` and the
        # NO_JS_CALL_FORM names). `--calls` is what computes the call
        # sets at all — the plain runs above write no call artifact.
        run: pnpm exec tsx scripts/api-compare/compare.ts --calls
      - name: Call-mismatches ratchet
        # Gates the RFC 0047 call-set artifact against the split call-mismatches-exclude/ baseline dir.
        # Fails on a new mismatch, a stale baseline entry, or more
        # still-unreviewed (seeded-default-reason) entries in one source file
        # than that file's committed high-water mark under
        # call-mismatches-unreviewed/; reseed with
        # `pnpm tsx scripts/api-compare/lint-call-mismatches.ts --write`.
        run: pnpm exec tsx scripts/api-compare/lint-call-mismatches.ts
      - name: Call-argument ratchet
        # Gates the RFC 0095 call-ARGUMENT artifact (written by the `--calls`
        # step above) against the `kind: "args"` rows of the shared
        # call-mismatches-exclude/ shards, only-shrink. `shape` rows only;
        # `naming` rows are report-only. Reports instead of failing until the
        # seed PR lands — see the UNSEEDED arm in lint-call-args.ts.
        run: pnpm exec tsx scripts/api-compare/lint-call-args.ts
      - name: Arm-parity report
        # RFC 0113 Phase 1. Reports the arm (control-token) mismatches in the
        # RFC 0084 skeleton artifact the `--calls` step above already wrote.
        # Report-only and exits 0 on any population: nothing gates until
        # `measure-arm-mismatch-noise-floor` puts a figure on it, and the merge
        # rule this reads it under is documented at report-arms.ts:ArmVerdict.
        run: pnpm exec tsx scripts/api-compare/report-arms.ts --report
      - name: Extra-surface ratchet
        # RFC 0117. Gates extra surface — public TS names in a Rails-matched
        # file with no Ruby counterpart — in one of two modes per package.
        # COUNTED (activerecord, ruby-compat): only-shrink against the marks in
        # scripts/api-compare/extra-surface-mark.json. Fails on any increase in
        # `novel` or `total`, reports a mark left above the current measurement,
        # and never raises one. Converged surface? Narrow the mark with
        # `pnpm parity:api:extra:tighten` — there is no reseed. activerecord
        # joined under RFC 0119 with the connection-adapter burndown behind it.
        # TAGGED-ONLY (arel): held at `novel === 0` with no mark row
        # at all — every extra carries a `@noRailsEquivalent` receipt at its
        # declaration, so there is no shared number to raise and none to
        # conflict over. Enrollment is only-grow; activerecord joins when the
        # extra-surface receipt burndown clears its 342. activemodel stays ungated until it has a
        # burndown of its own.
        run: pnpm exec tsx scripts/api-compare/lint-extra-surface-ratchet.ts
      - name: Parameter-name ratchet
        # RFC 0126. Gates arel's param-name row count (a matched pair whose
        # signatures line up positionally but whose parameters are spelled
        # differently from Rails') against the committed marks in
        # scripts/api-compare/param-name-mark.json. Only-shrink: fails on any
        # increase in the package total or in one Ruby file, reports a mark left
        # above the current measurement, and never raises one. Converged a
        # rename? Narrow the mark with `pnpm parity:api:params:tighten` — there
        # is no reseed. arel is enrolled alone because it is already at zero;
        # every other package is measured, reported, and joins by its own
        # burndown story.
        run: pnpm exec tsx scripts/api-compare/lint-param-names.ts
      - name: Ratchet baseline reseed drift
        # RFC 0083. The ratchet above only READS the committed baseline, so a
        # change that converges or seeds rows passes it and still leaves the
        # baseline stale. Runs on every event, `pull_request` included, so the
        # PR that introduces the drift fails rather than the `main` run after
        # it merges — every branch cut after that merge inherits the failure
        # (#5869 paid for that diagnosis on 5 unrelated STALE rows). No
        # separate `main`-only arm: `main` runs this identical step, so a
        # gated copy would only duplicate it. Ordered AFTER the ratchet
        # because `--write` mutates the baseline in the workspace; reseeding
        # first would make the ratchet gate its own output. `--write` skips
        # its own regeneration under CI, reusing the extraction step's
        # artifact.
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/api-compare/lint-call-mismatches.ts --write
          baseline='scripts/api-compare/call-mismatches-exclude'
          mark='scripts/api-compare/call-mismatches-unreviewed'
          # A reseed can add a baseline file for a package/file that had none.
          # Untracked paths are invisible to `git diff`, so record them as
          # intent-to-add first or the drift check silently passes.
          git add --intent-to-add -- "$baseline" "$mark"
          if git diff --quiet -- "$baseline" "$mark"; then
            echo "Ratchet baseline is in sync with a clean reseed."
            exit 0
          fi
          echo "::error title=Ratchet baseline drift::This branch leaves the committed call-mismatch baseline out of sync with a clean reseed. Prefer the reviewable fix shown in the diff below — delete the stale \`call-mismatches-exclude/\` entries your change converged, and give any newly seeded rows a real reason. \`pnpm parity:api:calls:reseed\` produces the same end state mechanically, at the cost of reordering untouched packages (see CONTRIBUTING.md)."
          git --no-pager diff --stat -- "$baseline" "$mark"
          git --no-pager diff -- "$baseline" "$mark"
          exit 1
      - name: Conventions doc up to date
        # docs/ruby-ts-conventions.md is generated from explainConventions()
        # in conventions.ts; fail if it drifts so the agent-facing doc can't
        # go stale. Regenerate with `pnpm parity:api:conventions`.
        run: pnpm exec tsx scripts/parity/conventions-doc.ts --check
      - name: Deprecation manifest up to date
        # eslint/rails-deprecated-methods.json is generated from the vendored
        # Ruby; fail if it drifts — a partial regeneration silently DROPS
        # entries and with them the rails-deprecated-jsdoc coverage for those
        # methods. Regenerate with `pnpm rails-privates:manifest`.
        run: pnpm exec tsx scripts/build-rails-privates-manifest.ts --check-deprecated
      - name: ESLint exclude baselines up to date
        # Both baselines are generated grandfather lists that only shrink as
        # sites convert. Nothing read them back, so they drifted ~200 rows loose
        # on main before this guard. Regenerate with
        # `pnpm tsx scripts/generate-standalone-associations-exclude.ts` and
        # `pnpm fixture-baseline:refresh`.
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/generate-standalone-associations-exclude.ts
          pnpm exec tsx scripts/test-deps/rails-test-deps.ts
          pnpm exec tsx scripts/test-deps/build-fixture-baseline.ts
          baselines='eslint/no-standalone-associations-exclude.json eslint/expected-fixtures-exclude.json'
          if git diff --quiet -- $baselines; then
            echo "ESLint exclude baselines are in sync with a fresh regeneration."
            exit 0
          fi
          echo "::error title=ESLint exclude baseline drift::A committed ESLint exclude baseline differs from a fresh regeneration. Run the generators and commit the result — the diff below is what your branch is missing."
          git --no-pager diff -- $baselines
          exit 1
      - name: Schema comparison
        # Structural parity of TEST_SCHEMA against the vendored
        # test/schema/schema.rb it mirrors (RFC 0025). Fails on a table or
        # column present in TEST_SCHEMA but absent from schema.rb, gated
        # against scripts/schema-compare/invented-baseline.json — pre-existing
        # debt only, and the baseline must never grow. Shape divergences on
        # shared tables are report-only for now (`--verbose` lists them).
        run: pnpm exec tsx scripts/schema-compare/compare.ts
      - name: Schema comparison unit tests
        # scripts/schema-compare/compare.test.ts parses the REAL vendored
        # test/schema/schema.rb (not just synthetic snippets), so it only has
        # signal after the vendor:fetch step above — hence here rather than in
        # the unit-tests job, where the rest of the compare tooling's tests run.
        run: pnpm vitest run scripts/schema-compare
      - name: Dependency lint
        run: pnpm exec tsx scripts/api-compare/lint-deps.ts
      - name: Rails-private JSDoc lint
        # Needs rails-api.json (extracted above) to enforce
        # blazetrails/rails-private-jsdoc. The standalone Lint job has no Ruby
        # and intentionally no-ops this rule via `--allow-missing`; here the
        # builder runs WITHOUT that flag, so a missing extraction fails the job
        # instead of quietly producing an empty manifest the rule can't match.
        # Uses the standalone eslint/rails-private-jsdoc.config.mjs so this step
        # runs that ONE rule over every package the root config enables it for,
        # rather than re-running the whole ruleset (which would duplicate the
        # Lint job). Linting only packages/arel/src here left activesupport,
        # activemodel, actionpack, actionview and activerecord unenforced.
        run: |
          pnpm exec tsx scripts/build-rails-privates-manifest.ts
          pnpm exec eslint --no-inline-config --config eslint/rails-private-jsdoc.config.mjs packages
      - name: Rails file-structure method-order lint
        # Needs rails-api.json (extracted above) to build the per-class
        # method-order manifest, then enforce
        # blazetrails/rails-file-structure-method-order. The manifest is
        # gitignored and only exists here (never committed), so the
        # standalone Lint job intentionally no-ops this rule via
        # `--allow-missing` — this is the only job where it goes live, and here
        # the builder runs without that flag so a missing extraction fails
        # loudly rather than emptying the manifest. Enabled per-package via
        # eslint.config.mjs (arel + activemodel). RAILS_STRUCTURE_REPORT=1 prints
        # (to stderr, non-failing) any manifest bucket that matched no container
        # — a renamed class past the fallback, or a module ported as a class —
        # so the silent-drop surface stays visible in the job log.
        env:
          RAILS_STRUCTURE_REPORT: "1"
        run: pnpm exec tsx scripts/build-rails-file-structure-manifest.ts && pnpm exec eslint packages/arel/src packages/activemodel/src
      - name: Rails test-name parity ratchet
        # Only-shrink per-file gate on TS-only tests sitting in Rails-named
        # test files (RFC 0124). The manifest needs the Ruby test extraction
        # above, so like the file-structure rule this is the only job that can
        # enforce it. Tighten after moving tests out with
        # `pnpm parity:test:names:tighten`.
        run: pnpm exec tsx scripts/build-rails-test-names-manifest.ts && pnpm exec eslint packages/arel/src packages/date/src packages/did-you-mean/src packages/i18n/src --max-warnings 0
      - name: Test comparison
        # --gates prints the adapter/feature gate-mismatch breakdown; --check
        # fails the step if activerecord's gate-mismatch count is non-zero
        # (hard zero, no baseline — RFC 0032 ar-gate-fidelity-burndown).
        run: pnpm exec tsx scripts/test-compare/extract-ts-tests.ts && pnpm exec tsx scripts/test-compare/compare.ts --gates --check
      - name: Assertion-mismatch ratchet
        # Only-shrink gate on the assertion-count / kind / value totals inside
        # name-matched tests (RFC 0025). Reads output/convention-comparison.json
        # written by the step above — --no-regen because CI must not pay for the
        # extraction twice. Reseed after convergence with
        # `pnpm parity:test:assertions:reseed`.
        run: pnpm exec tsx scripts/test-compare/lint-assertion-mismatches.ts --no-regen
      - name: AR-closure test manifest guard
        # Fails when a file under vendor/rails/activesupport/test/ is neither
        # derived by R1/R2 nor aliased nor listed out-of-closure, so a vendor
        # bump cannot land a new Rails test file silently on either side of the
        # boundary (RFC 0105). Manifest only — it moves no denominator.
        run: pnpm exec tsx scripts/test-compare/closure-cli.ts --check
      - name: Fixtures comparison
        run: pnpm exec tsx scripts/fixtures-compare/compare.ts --package activerecord --ci
      - name: Models comparison
        run: pnpm exec tsx scripts/fixtures-compare/compare.ts --models

  schema-parity-rails:
    name: Schema Parity (Rails side)
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.parity_sqlite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Cache bundled gems
        uses: actions/cache@v4
        with:
          path: scripts/parity/pipeline/schema/ruby/vendor/bundle
          key: ${{ runner.os }}-parity-gems-${{ hashFiles('scripts/parity/pipeline/schema/ruby/Gemfile', 'scripts/parity/pipeline/schema/ruby/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-parity-gems-
      - name: Bundle install
        run: bundle install --jobs 4 --retry 3 --path vendor/bundle
        working-directory: scripts/parity/pipeline/schema/ruby
      - name: Upload Gemfile.lock artifact (commit this to the repo for stable caching)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-ruby-gemfile-lock
          path: scripts/parity/pipeline/schema/ruby/Gemfile.lock
          retention-days: 7
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Rails-side dump
        run: pnpm tsx scripts/parity/pipeline/run.ts --side=rails
      - uses: actions/upload-artifact@v4
        with:
          name: parity-rails-dumps
          path: scripts/parity/pipeline/.out/rails/
          retention-days: 1

  schema-parity-trails:
    name: Schema Parity (trails side)
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.parity_sqlite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build dependency packages for trails introspection
        run: pnpm --filter "@blazetrails/activerecord^..." build
      - name: Run trails-side dump
        run: pnpm tsx scripts/parity/pipeline/run.ts --side=trails
      - uses: actions/upload-artifact@v4
        with:
          name: parity-trails-dumps
          path: scripts/parity/pipeline/.out/trails/
          retention-days: 1

  schema-parity-diff:
    name: Schema Parity (diff)
    needs:
      - changes
      - schema-parity-rails
      - schema-parity-trails
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.parity_sqlite == 'true' &&
      needs.schema-parity-rails.result == 'success' &&
      needs.schema-parity-trails.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          name: parity-rails-dumps
          path: scripts/parity/pipeline/.out/rails/
      - uses: actions/download-artifact@v4
        with:
          name: parity-trails-dumps
          path: scripts/parity/pipeline/.out/trails/
      - name: Diff canonical outputs
        run: pnpm tsx scripts/parity/pipeline/schema/diff.ts --rails-dir scripts/parity/pipeline/.out/rails --trails-dir scripts/parity/pipeline/.out/trails

  query-parity-frozen-at:
    name: Query Parity (compute frozen-at)
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.parity_sqlite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Minted once per workflow run and consumed by both dump jobs so they
      # freeze time to the same instant. ISO-8601 UTC with ms precision and
      # trailing Z — matches scripts/parity/pipeline/canonical/query.schema.json.
      value: ${{ steps.gen.outputs.value }}
    steps:
      - id: gen
        run: |
          ts=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          echo "value=$ts" >> "$GITHUB_OUTPUT"
          echo "frozen-at: $ts"

  query-parity-rails:
    name: Query Parity (Rails side)
    needs:
      - changes
      - query-parity-frozen-at
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.parity_sqlite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARITY_FROZEN_AT: ${{ needs.query-parity-frozen-at.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Cache bundled gems
        uses: actions/cache@v4
        with:
          path: scripts/parity/pipeline/schema/ruby/vendor/bundle
          key: ${{ runner.os }}-parity-gems-${{ hashFiles('scripts/parity/pipeline/schema/ruby/Gemfile', 'scripts/parity/pipeline/schema/ruby/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-parity-gems-
      - name: Bundle install
        run: bundle install --jobs 4 --retry 3 --path vendor/bundle
        working-directory: scripts/parity/pipeline/schema/ruby
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Rails-side query dump
        run: pnpm tsx scripts/parity/pipeline/run.ts --type=query --side=rails
      - uses: actions/upload-artifact@v4
        with:
          name: parity-query-rails-dumps
          path: scripts/parity/pipeline/.out/query/rails/
          retention-days: 1

  query-parity-trails:
    name: Query Parity (trails side)
    needs:
      - changes
      - query-parity-frozen-at
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.parity_sqlite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARITY_FROZEN_AT: ${{ needs.query-parity-frozen-at.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build activerecord and its workspace dependencies
        run: pnpm --filter "@blazetrails/activerecord..." build
      - name: Run trails-side query dump
        run: pnpm tsx scripts/parity/pipeline/run.ts --type=query --side=trails
      - uses: actions/upload-artifact@v4
        with:
          name: parity-query-trails-dumps
          path: scripts/parity/pipeline/.out/query/trails/
          retention-days: 1

  query-parity-diff:
    name: Query Parity (diff)
    needs:
      - changes
      - query-parity-rails
      - query-parity-trails
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.parity_sqlite == 'true' &&
      needs.query-parity-rails.result == 'success' &&
      needs.query-parity-trails.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          name: parity-query-rails-dumps
          path: scripts/parity/pipeline/.out/query/rails/
      - uses: actions/download-artifact@v4
        with:
          name: parity-query-trails-dumps
          path: scripts/parity/pipeline/.out/query/trails/
      - name: Diff canonical query outputs
        run: pnpm tsx scripts/parity/pipeline/query/diff.ts --rails-dir scripts/parity/pipeline/.out/query/rails --trails-dir scripts/parity/pipeline/.out/query/trails

  ci:
    name: CI
    if: ${{ always() }}
    needs:
      - changes
      - build-and-typecheck
      - lint
      - preflight
      - guides-typecheck
      - leaf-tests
      - virtualized-dx-type-tests
      - trails-tsc-tests
      - unit-tests
      - actionpack-tests
      - trailties-tests
      - sqlite-tests
      - sqlite-mem-tests
      - maria-prepared-tests
      - postgres-tests
      - mysql-tests
      - maria-tests
      - website
      - rails-comparison
      - schema-parity-rails
      - schema-parity-trails
      - schema-parity-diff
      - query-parity-frozen-at
      - query-parity-rails
      - query-parity-trails
      - query-parity-diff
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fail if any required job failed, was cancelled, or unexpectedly skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          AR_AFFECTED: ${{ needs.changes.outputs.activerecord_affected }}
          AP_AFFECTED: ${{ needs.changes.outputs.actionpack_affected }}
          AV_AFFECTED: ${{ needs.changes.outputs.actionview_affected }}
          RACK_AFFECTED: ${{ needs.changes.outputs.rack_affected }}
          TRAILTIES_AFFECTED: ${{ needs.changes.outputs.trailties_affected }}
          TRAILS_TSC_AFFECTED: ${{ needs.changes.outputs.trails_tsc_affected }}
          TSE_COMPILER_AFFECTED: ${{ needs.changes.outputs.tse_compiler_affected }}
          UNIT_TESTS_AFFECTED: ${{ needs.changes.outputs.unit_tests_affected }}
          GUIDES_AFFECTED: ${{ needs.changes.outputs.guides_affected }}
          WEBSITE_AFFECTED: ${{ needs.changes.outputs.website_affected }}
          COMPARISON_AFFECTED: ${{ needs.changes.outputs.comparison_affected }}
          WEBSITE_LABEL: ${{ needs.changes.outputs.website_label }}
          PARITY_SQLITE: ${{ needs.changes.outputs.parity_sqlite }}
          PARITY_POSTGRES: ${{ needs.changes.outputs.parity_postgres }}
          PARITY_MYSQL: ${{ needs.changes.outputs.parity_mysql }}
          SQLITE_MEM_UNLABELLED: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'run-sqlite-mem') }}
          MYSQL_PREPARED_NOT_REQUIRED: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-mysql-prepared')) }}
          DB_ADAPTERS_DRAFT_DEFERRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && needs.changes.outputs.db_adapter_affected != 'true' && !contains(github.event.pull_request.labels.*.name, 'run-db-adapters') }}
          GUIDES_UNLABELLED: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'run-guides') }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON"
          # Hard failures: failure or cancelled.
          bad=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$bad" ]; then
            echo "Failed/cancelled jobs:"
            echo "$bad"
            exit 1
          fi
          # Allow-list jobs that may legitimately skip, conditioned on the
          # gate that produced the skip. Anything else skipping means a gate
          # mis-evaluated and downstream silently passed.
          unexpected=0
          # Docs-only legitimately skips every gated downstream.
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "docs_only=true — all downstream skips are expected."
          else
            any_parity=false
            for v in "$PARITY_SQLITE" "$PARITY_POSTGRES" "$PARITY_MYSQL"; do
              [ "$v" = "true" ] && any_parity=true
            done
            while read -r job result; do
              [ "$result" = "skipped" ] || continue
              case "$job" in
                changes|ci) continue ;;
                preflight)
                  # Always runs (its prettier / docs-AR-freeze / pr-attribution
                  # steps self-gate via per-step `if:`, so an inapplicable check
                  # no-ops rather than skipping the job). A whole-job skip only
                  # happens if `changes` itself failed — already caught above —
                  # so treat any skip here as legitimate.
                  continue
                  ;;
                mysql-tests)
                  # Temporarily disabled (if: false) — its skip is always
                  # legitimate until the job is re-enabled.
                  continue
                  ;;
                sqlite-tests)
                  # AR test skip is legitimate when no AR-affecting paths changed.
                  if [ "$AR_AFFECTED" = "false" ]; then
                    continue
                  fi
                  ;;
                postgres-tests|maria-tests)
                  # Both are 2-way `--shard` matrices; GitHub collapses the
                  # legs into a single result under the job id here, so these
                  # two names cover all four legs — do NOT add per-leg names
                  # (they don't exist in the `needs` context).
                  if [ "$AR_AFFECTED" = "false" ] || \
                     [ "$DB_ADAPTERS_DRAFT_DEFERRED" = "true" ]; then
                    continue
                  fi
                  ;;
                sqlite-mem-tests)
                  if [ "$AR_AFFECTED" = "false" ] || \
                     [ "$SQLITE_MEM_UNLABELLED" = "true" ]; then
                    continue
                  fi
                  ;;
                maria-prepared-tests)
                  if [ "$AR_AFFECTED" = "false" ] || \
                     [ "$MYSQL_PREPARED_NOT_REQUIRED" = "true" ]; then
                    continue
                  fi
                  ;;
                actionpack-tests)
                  # Actionpack test skip is legitimate when no actionpack-affecting paths changed.
                  if [ "$AP_AFFECTED" = "false" ]; then
                    continue
                  fi
                  ;;
                trailties-tests)
                  if [ "$TRAILTIES_AFFECTED" = "false" ]; then
                    continue
                  fi
                  ;;
                leaf-tests)
                  # Consolidated rack/actionview/tse-compiler/dx-type job.
                  # A skip is legitimate only when EVERY member flag is false
                  # (the DX type step is gated on activerecord OR trailties).
                  if [ "$RACK_AFFECTED" = "false" ] && \
                     [ "$AV_AFFECTED" = "false" ] && \
                     [ "$TSE_COMPILER_AFFECTED" = "false" ] && \
                     [ "$AR_AFFECTED" = "false" ] && \
                     [ "$TRAILTIES_AFFECTED" = "false" ]; then
                    continue
                  fi
                  ;;
                unit-tests)
                  if [ "$UNIT_TESTS_AFFECTED" = "false" ]; then
                    continue
                  fi
                  ;;
                guides-typecheck)
                  if [ "$GUIDES_AFFECTED" = "false" ] || \
                     [ "$GUIDES_UNLABELLED" = "true" ]; then
                    continue
                  fi
                  ;;
                rails-comparison)
                  # Legitimate skip when no comparison-relevant path changed
                  # (no packages/**, scripts/{api,test,fixtures,schema}-compare/**,
                  # comparison-consumed manifest builders, vendor/**, or
                  # cross-cutting infra — see COMPARISON_RE).
                  if [ "$COMPARISON_AFFECTED" = "false" ]; then
                    continue
                  fi
                  ;;
                website)
                  # Temporarily disabled (if: false) — its skip is always
                  # legitimate until the job is re-enabled. On re-enable,
                  # replace this `continue` with the original guard:
                  #   if [ "$WEBSITE_AFFECTED" = "false" ] && [ "$WEBSITE_LABEL" != "true" ]; then
                  #     continue
                  #   fi
                  continue
                  ;;
                trails-tsc-tests)
                  # Legitimate skip when neither trails-tsc nor tse-compiler changed.
                  if [ "$TRAILS_TSC_AFFECTED" = "false" ] && [ "$TSE_COMPILER_AFFECTED" = "false" ]; then
                    continue
                  fi
                  ;;
                virtualized-dx-type-tests)
                  # Legitimate skip when neither activerecord nor trails-tsc paths changed.
                  if [ "$AR_AFFECTED" = "false" ] && [ "$TRAILS_TSC_AFFECTED" = "false" ]; then
                    continue
                  fi
                  ;;
                schema-parity-rails|schema-parity-trails|schema-parity-diff|\
                query-parity-frozen-at|query-parity-rails|query-parity-trails|query-parity-diff)
                  # Parity skip is legitimate when no parity gate is on.
                  if [ "$any_parity" = "false" ]; then
                    continue
                  fi
                  ;;
              esac
              echo "Unexpectedly skipped job: $job (docs_only=$DOCS_ONLY ar_affected=$AR_AFFECTED ap_affected=$AP_AFFECTED av_affected=$AV_AFFECTED rack_affected=$RACK_AFFECTED trailties_affected=$TRAILTIES_AFFECTED trails_tsc_affected=$TRAILS_TSC_AFFECTED tse_compiler_affected=$TSE_COMPILER_AFFECTED unit_tests_affected=$UNIT_TESTS_AFFECTED guides_affected=$GUIDES_AFFECTED website_affected=$WEBSITE_AFFECTED comparison_affected=$COMPARISON_AFFECTED website_label=$WEBSITE_LABEL parity_sqlite=$PARITY_SQLITE parity_postgres=$PARITY_POSTGRES parity_mysql=$PARITY_MYSQL db_adapters_draft_deferred=$DB_ADAPTERS_DRAFT_DEFERRED guides_unlabelled=$GUIDES_UNLABELLED)"
              unexpected=1
            done < <(echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key) \(.value.result)"')
          fi
          [ "$unexpected" -eq 0 ] || exit 1
          echo "All jobs passed or were intentionally skipped."

      # Informational only — never fails the run. Captures peer-job
      # durations from the same workflow run; CI's own duration is excluded
      # because it isn't final at the time of this query.
      - name: Job timing report
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          {
            echo "### Job durations (longest first)"
            echo ""
            echo "| Job | Status | Duration |"
            echo "|-----|--------|----------|"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" > /tmp/jobs.json; then
            echo "_(timing report unavailable: gh api failed)_" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '
            .jobs[]
            | select(.name != "CI")
            | select(.started_at != null and .completed_at != null)
            | [
                ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)),
                .name,
                (.conclusion // "running")
              ]
            | @tsv
          ' /tmp/jobs.json \
            | sort -rn \
            | awk -F'\t' '{
                s=$1; m=int(s/60); r=s-m*60;
                printf("| %s | %s | %dm%02ds |\n", $2, $3, m, r)
              }' >> "$GITHUB_STEP_SUMMARY"
