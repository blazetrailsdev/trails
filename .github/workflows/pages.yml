name: Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/website/**"
      - "packages/*/lib/**"
      - "packages/*/package.json"
      - "README.md"
      - "scripts/quickstart/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_BASE: /trails
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @blazetrails/website exec svelte-kit sync
      - name: Build SvelteKit
        run: pnpm --filter @blazetrails/website exec vite build
      - name: Build docs (typedoc + VitePress)
        run: pnpm --filter @blazetrails/website run docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
