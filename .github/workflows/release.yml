name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run scripts/package-publish-shape.test.ts
      - name: Tag matches the lockstep version
        if: github.event_name == 'push'
        run: |
          version="$(node -p 'require("./packages/trails/package.json").version')"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Publish (dry run)
        if: github.event_name == 'pull_request'
        run: pnpm -r publish --dry-run --no-git-checks --tag alpha
      - name: Publish
        if: github.event_name == 'push'
        run: |
          case "$GITHUB_REF_NAME" in *-alpha*) tag=alpha ;; *) tag=latest ;; esac
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc
          pnpm -r publish --no-git-checks --provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
