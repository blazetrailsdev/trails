name: Shard durations

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: green main CI runs to take the median over
        default: "5"

concurrency:
  group: shard-durations
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.SHARD_DURATIONS_TOKEN }}
      RUNS: ${{ inputs.runs || '5' }}
      BRANCH: ci/refresh-ar-shard-durations
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SHARD_DURATIONS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - run: node scripts/ci/ar-shard-durations.mjs --latest "$RUNS"
      - name: Open a PR when the table changed
        run: |
          if git diff --quiet -- scripts/ci/ar-shard-durations.json; then
            echo "table unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "ci: refresh AR shard duration table" -- scripts/ci/ar-shard-durations.json
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --draft --head "$BRANCH" --title "ci: refresh AR shard duration table" \
              --body "Median per-file times over the latest $RUNS green main CI runs (\`node scripts/ci/ar-shard-durations.mjs --latest N\`)."
          fi
